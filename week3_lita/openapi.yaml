openapi: 3.0.3
info:
  title: Neon Database CRUD API
  description: API Richardson Maturity Model Level 3 dengan navigasi HATEOAS untuk data siswa, guru, dan staff.
  version: 1.0.0
servers:
  - url: /
    description: Current server (local or deployed)
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/students:
    get:
      summary: List all students
      responses:
        '200':
          description: Student resources with hypermedia links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonResource'
    post:
      summary: Create a student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonInput'
      responses:
        '201':
          description: Student created with hypermedia links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResource'

  /api/students/{id}:
    get:
      summary: Get a student by id
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Student resource with hypermedia links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResource'
    put:
      summary: Update a student by id
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonInput'
      responses:
        '200':
          description: Student updated with hypermedia links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResource'
    delete:
      summary: Delete a student by id
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Student deleted with a collection link

  /api/teachers:
    get:
      summary: List all teachers
      responses:
        '200':
          description: Teacher resources with hypermedia links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonResource'
    post:
      summary: Create a teacher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonInput'
      responses:
        '201':
          description: Teacher created with hypermedia links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResource'

  /api/teachers/{id}:
    get:
      summary: Get a teacher by id
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Teacher resource with hypermedia links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResource'
    put:
      summary: Update a teacher by id
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonInput'
      responses:
        '200':
          description: Teacher updated with hypermedia links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResource'
    delete:
      summary: Delete a teacher by id
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Teacher deleted with a collection link

  /api/staff:
    get:
      summary: List all staff
      responses:
        '200':
          description: Staff resources with hypermedia links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonResource'
    post:
      summary: Create a staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonInput'
      responses:
        '201':
          description: Staff created with hypermedia links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResource'

  /api/staff/{id}:
    get:
      summary: Get a staff member by id
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Staff resource with hypermedia links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResource'
    put:
      summary: Update a staff member by id
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonInput'
      responses:
        '200':
          description: Staff updated with hypermedia links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResource'
    delete:
      summary: Delete a staff member by id
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Staff deleted with a collection link

components:
  parameters:
    ID:
      in: path
      name: id
      required: true
      schema:
        type: integer
  schemas:
    PersonInput:
      type: object
      required: [nama, umur, tanggal]
      properties:
        nama:
          type: string
          example: Lita
        umur:
          type: integer
          example: 20
        tanggal:
          type: string
          format: date
          example: '2006-05-12'
    Person:
      type: object
      required: [id, nama, umur, tanggal]
      properties:
        id:
          type: integer
          example: 1
        nama:
          type: string
          example: Lita
        umur:
          type: integer
          example: 20
        tanggal:
          type: string
          format: date
          example: '2006-05-12'
    Link:
      type: object
      required: [href, method]
      properties:
        href:
          type: string
          example: /api/students/1
        method:
          type: string
          enum: [GET, POST, PUT, DELETE]
          example: GET
    PersonResource:
      allOf:
        - $ref: '#/components/schemas/Person'
        - type: object
          required: [_links]
          properties:
            _links:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/Link'
